<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhine AI Lab · University of Basel and UCL</title>
    <meta name="theme-color" content="#f7f5f1" />
    <meta name="description" content="Rhine AI Lab (Bogunovic Lab) at the University of Basel and the UCL Centre for Artificial Intelligence. Agentic AI systems that reason, adapt and self-evolve: reinforcement learning, exploration and discovery." />
    <meta name="author" content="Rhine AI Lab" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/mark-carmine.svg">
    <link rel="icon" type="image/png" href="/icons/mark-carmine.png">
    <link rel="apple-touch-icon" href="/icons/mark-carmine.png">


    <meta property="og:title" content="Rhine AI Lab" />
    <meta property="og:description" content="Reasoning, Human-aligned Intelligence and Novel Exploration. University of Basel and UCL." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ilijabogunovic.github.io/rhine-ai/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ilijabogunovic" />
    <meta name="twitter:image" content="https://ilijabogunovic.github.io/rhine-ai/logo.png" />
  </head>

  <body>
    <script>
      document.documentElement.classList.add('js');
      try {
        var m = localStorage.getItem('rhine-mode');
        var dark = m === 'dark' || ((!m || m === 'auto') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect handler:
      // 404.html saves the original URL to sessionStorage and redirects here.
      // This script restores the correct route so React Router can handle it.
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
